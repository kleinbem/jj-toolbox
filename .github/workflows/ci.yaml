name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax check (bash -n)
        run: |
          for script in bin/*; do
            bash -n "$script"
          done
      - name: ShellCheck
        run: |
          shellcheck -x -P bin -s bash bin/*
